<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Xem Mô Hình 3D IFC (GitHub Models)</title>
    <!-- Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 3px; }
    </style>

    <!-- Import Map cho Three.js & web-ifc-three -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/examples/jsm/controls/OrbitControls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
            "web-ifc": "https://unpkg.com/web-ifc@0.0.44/web-ifc-api.js",
            "web-ifc-three": "https://unpkg.com/web-ifc-three@0.0.126/IFCLoader.js"
        }
    }
    </script>
</head>
<body class="text-slate-200 select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Controls -->
    <div class="relative z-10 pointer-events-none w-full h-screen flex flex-col justify-between p-4">
        
        <!-- Header -->
        <header class="pointer-events-auto bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-xl p-3 shadow-2xl flex items-center justify-between gap-4 max-w-6xl mx-auto w-full">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600/20 text-blue-400 rounded-lg border border-blue-500/30">
                    <i data-lucide="box" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-100 text-base leading-tight">IFC 3D BIM Viewer</h1>
                    <p class="text-xs text-slate-400">Tự động quét thư mục <code class="bg-slate-800 px-1 py-0.5 rounded text-blue-400">models/</code> trên GitHub</p>
                </div>
            </div>

            <!-- Tải file thủ công từ máy tính -->
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-md transition flex items-center gap-2 border border-slate-700">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span>Tải file local (.ifc)</span>
                <input type="file" id="local-file-input" accept=".ifc" class="hidden">
            </label>
        </header>

        <!-- Main Workspace (Sidebar + Viewer) -->
        <div class="flex-1 flex justify-between gap-4 my-4 overflow-hidden">
            
            <!-- Sidebar Trái: Danh sách File Mô Hình & Thuộc tính -->
            <aside class="pointer-events-auto w-80 bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-xl p-4 shadow-xl flex flex-col gap-4 overflow-y-auto">
                <!-- Danh sách file quét từ GitHub -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                            <i data-lucide="folder-git-2" class="w-4 h-4 text-blue-400"></i> Mô Hình Trong Repository
                        </h3>
                        <button id="refresh-btn" class="text-slate-400 hover:text-slate-200 p-1 rounded hover:bg-slate-800 transition" title="Quét lại">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>

                    <div id="models-list" class="space-y-1.5 text-xs">
                        <div class="text-slate-400 bg-slate-950/50 p-3 rounded-lg border border-slate-800/60 text-center flex items-center justify-center gap-2">
                            <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-blue-400"></i>
                            Đang kết nối GitHub API...
                        </div>
                    </div>
                </div>

                <hr class="border-slate-800">

                <!-- Bảng thuộc tính BIM -->
                <div class="flex-1 flex flex-col">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                        <i data-lucide="info" class="w-4 h-4 text-emerald-400"></i> Thuộc Tính Cấu Kiện (BIM Data)
                    </h3>
                    <div id="property-panel" class="flex-1 text-xs text-slate-400 bg-slate-950/50 p-3 rounded-lg border border-slate-800/60 overflow-y-auto max-h-[220px]">
                        Click chọn một vật thể 3D để xem thông số chi tiết.
                    </div>
                </div>
            </aside>

            <!-- Sidebar Phải: Công cụ điều khiển 3D -->
            <aside class="pointer-events-auto w-60 bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-xl p-4 shadow-xl flex flex-col gap-4 self-start">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i> Cấu Hình Xem
                </h3>

                <div class="space-y-2.5 text-xs">
                    <label class="flex items-center justify-between p-2 bg-slate-950/40 rounded-lg border border-slate-800/60 cursor-pointer hover:bg-slate-800/40">
                        <span class="flex items-center gap-2"><i data-lucide="grid" class="w-4 h-4 text-slate-400"></i> Lưới Mặt Đất</span>
                        <input type="checkbox" id="toggle-grid" checked class="rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-0">
                    </label>

                    <label class="flex items-center justify-between p-2 bg-slate-950/40 rounded-lg border border-slate-800/60 cursor-pointer hover:bg-slate-800/40">
                        <span class="flex items-center gap-2"><i data-lucide="box" class="w-4 h-4 text-slate-400"></i> Khung Dây</span>
                        <input type="checkbox" id="toggle-wireframe" class="rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-0">
                    </label>

                    <label class="flex items-center justify-between p-2 bg-slate-950/40 rounded-lg border border-slate-800/60 cursor-pointer hover:bg-slate-800/40">
                        <span class="flex items-center gap-2"><i data-lucide="rotate-cw" class="w-4 h-4 text-slate-400"></i> Tự Động Xoay</span>
                        <input type="checkbox" id="toggle-rotate" class="rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-0">
                    </label>
                </div>

                <hr class="border-slate-800">

                <button id="reset-view-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium py-2 rounded-lg border border-slate-700 transition flex items-center justify-center gap-2">
                    <i data-lucide="focus" class="w-4 h-4"></i> Căn Giữa Camera
                </button>
            </aside>
        </div>

        <!-- Footer / Status Bar -->
        <footer class="pointer-events-auto bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-xl px-4 py-2 text-xs text-slate-400 flex justify-between items-center max-w-6xl mx-auto w-full">
            <span id="status-text" class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                Sẵn sàng.
            </span>
            <div id="progress-container" class="hidden items-center gap-3 w-64">
                <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden border border-slate-700">
                    <div id="progress-bar" class="bg-blue-500 h-1.5 rounded-full w-0 transition-all duration-150"></div>
                </div>
                <span id="progress-text" class="text-[10px] text-slate-400 whitespace-nowrap">0%</span>
            </div>
        </footer>
    </div>

    <!-- Application Script (ES Module) -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';
        import { IFCLoader } from 'web-ifc-three';

        // =================================================================
        // ⚙️ CẤU HÌNH GITHUB REPOSITORY CỦA BẠN TẠI ĐÂY
        // =================================================================
        const OWNER = 'hiepsitemple'; // Thay bằng Tên người dùng GitHub của bạn
        const REPO = 'illumi-ifc-viewer';        // Thay bằng Tên Repository của bạn
        const BRANCH = 'main';                // Tên nhánh chính (main hoặc master)
        // =================================================================

        // Khởi tạo Lucide icons
        lucide.createIcons();

        // Canvas & Three.js Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        // Camera Setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 20, 30);

        // Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 80, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x90caf9, 0.5);
        dirLight2.position.set(-50, -20, -40);
        scene.add(dirLight2);

        // Grid
        const gridHelper = new THREE.GridHelper(100, 100, 0x3b82f6, 0x1e293b);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        // Setup IFC Loader
        const ifcLoader = new IFCLoader();
        ifcLoader.ifcManager.setWasmPath('https://unpkg.com/web-ifc@0.0.44/');

        // DOM Element References
        const modelsList = document.getElementById('models-list');
        const statusText = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressContainer = document.getElementById('progress-container');
        const propertyPanel = document.getElementById('property-panel');
        const refreshBtn = document.getElementById('refresh-btn');
        const localFileInput = document.getElementById('local-file-input');

        let currentModel = null;

        // 1. Hàm quét danh sách File trong thư mục "models" bằng GitHub REST API
        async function fetchGitHubModels() {
            modelsList.innerHTML = `
                <div class="text-slate-400 bg-slate-950/50 p-3 rounded-lg border border-slate-800/60 text-center flex items-center justify-center gap-2">
                    <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-blue-400"></i>
                    Đang quét thư mục models...
                </div>
            `;
            lucide.createIcons();

            const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/models?ref=${BRANCH}`;

            try {
                const response = await fetch(apiUrl);
                
                if (response.status === 404) {
                    modelsList.innerHTML = `
                        <div class="p-3 bg-rose-950/40 border border-rose-800/60 rounded-lg text-rose-300 text-xs">
                            <p class="font-semibold mb-1">Thư mục không tồn tại!</p>
                            <p class="text-[11px] text-rose-400/80">Hãy đảm bảo bạn đã tạo thư mục <code class="bg-rose-900/50 px-1 rounded">models/</code> trong repo <b>${REPO}</b>.</p>
                        </div>
                    `;
                    return;
                }

                if (response.status === 403) {
                    modelsList.innerHTML = `
                        <div class="p-3 bg-amber-950/40 border border-amber-800/60 rounded-lg text-amber-300 text-xs">
                            <p class="font-semibold mb-1">Bị giới hạn API GitHub!</p>
                            <p class="text-[11px] text-amber-400/80">Vui lòng chờ ít phút hoặc tải file trực tiếp qua nút ở góc trên.</p>
                        </div>
                    `;
                    return;
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error("Dữ liệu trả về không hợp lệ");
                }

                // Lọc các file có đuôi .ifc
                const ifcFiles = data.filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.ifc'));

                if (ifcFiles.length === 0) {
                    modelsList.innerHTML = `
                        <div class="p-3 bg-slate-950/50 border border-slate-800/60 rounded-lg text-slate-400 text-center text-xs">
                            Không tìm thấy file <code class="text-blue-400">.ifc</code> nào trong thư mục <b>models/</b>.
                        </div>
                    `;
                    return;
                }

                // Hiển thị danh sách các file IFC lên UI
                modelsList.innerHTML = '';
                ifcFiles.forEach(file => {
                    const fileCard = document.createElement('button');
                    fileCard.className = 'w-full text-left p-2.5 bg-slate-950/60 hover:bg-blue-900/30 border border-slate-800/80 hover:border-blue-500/50 rounded-lg transition flex items-center justify-between group';
                    
                    fileCard.innerHTML = `
                        <div class="flex items-center gap-2 truncate pr-2">
                            <i data-lucide="file-text" class="w-4 h-4 text-blue-400 shrink-0"></i>
                            <span class="truncate font-medium text-slate-200 group-hover:text-blue-300">${file.name}</span>
                        </div>
                        <i data-lucide="play-circle" class="w-4 h-4 text-slate-500 group-hover:text-blue-400 shrink-0"></i>
                    `;

                    // Sự kiện click chọn mô hình từ GitHub
                    fileCard.addEventListener('click', () => {
                        const rawUrl = file.download_url || `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/models/${file.name}`;
                        loadIFCFromURL(rawUrl, file.name);
                    });

                    modelsList.appendChild(fileCard);
                });

                lucide.createIcons();

            } catch (err) {
                console.error("Lỗi quét GitHub API:", err);
                modelsList.innerHTML = `
                    <div class="p-3 bg-slate-950/50 border border-slate-800/60 rounded-lg text-slate-400 text-xs text-center">
                        Không thể kết nối API. Hãy kiểm tra lại hằng số <b>OWNER</b> và <b>REPO</b> trong file code.
                    </div>
                `;
            }
        }

        // 2. Hàm tải và giải mã file IFC từ URL
        async function loadIFCFromURL(url, fileName) {
            statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Đang tải <b>${fileName}</b>...`;
            progressContainer.classList.remove('hidden');
            progressContainer.classList.add('flex');
            progressBar.style.width = '10%';
            progressText.textContent = '10%';

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                progressBar.style.width = '50%';
                progressText.textContent = '50%';
                statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> Đang giải mã mô hình 3D...`;

                const buffer = await response.arrayBuffer();

                // Xóa mô hình cũ nếu đang mở
                if (currentModel) {
                    scene.remove(currentModel);
                    currentModel = null;
                }

                // Dựng mô hình IFC qua WebAssembly
                ifcLoader.ifcManager.parse(buffer).then((ifcModel) => {
                    currentModel = ifcModel;
                    scene.add(ifcModel);

                    // Căn chỉnh camera vừa khung hình
                    const box = new THREE.Box3().setFromObject(ifcModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);

                    controls.target.copy(center);
                    camera.position.set(center.x + maxDim * 1.2, center.y + maxDim * 0.8, center.z + maxDim * 1.2);
                    controls.update();

                    // Hoàn tất
                    progressBar.style.width = '100%';
                    progressText.textContent = '100%';
                    setTimeout(() => progressContainer.classList.add('hidden'), 500);

                    statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Đã hiển thị: <b>${fileName}</b>`;
                });

            } catch (err) {
                console.error("Lỗi nạp file IFC:", err);
                statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> Lỗi tải file! Vui lòng thử lại.`;
                progressContainer.classList.add('hidden');
            }
        }

        // 3. Tải file thủ công từ máy tính
        localFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            loadIFCFromURL(url, file.name);
        });

        // 4. Click chọn vật thể 3D để xem ID
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.tagName !== 'CANVAS' || !currentModel) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(currentModel);

            if (intersects.length > 0) {
                const faceIndex = intersects[0].faceIndex;
                const expressID = ifcLoader.ifcManager.getExpressId(currentModel.geometry, faceIndex);

                if (expressID !== undefined) {
                    propertyPanel.innerHTML = `
                        <div class="space-y-1.5 text-left">
                            <div class="text-blue-400 font-semibold border-b border-slate-800 pb-1">Express ID: #${expressID}</div>
                            <div><span class="text-slate-400">Định dạng:</span> <span class="text-slate-200">IFC Mesh Component</span></div>
                            <div><span class="text-slate-400">Tọa độ chọn:</span> <br><span class="font-mono text-[10px] text-emerald-400">X:${intersects[0].point.x.toFixed(2)}, Y:${intersects[0].point.y.toFixed(2)}, Z:${intersects[0].point.z.toFixed(2)}</span></div>
                        </div>
                    `;
                }
            }
        });

        // Event listeners cho công cụ xem
        document.getElementById('toggle-grid').addEventListener('change', (e) => gridHelper.visible = e.target.checked);
        document.getElementById('toggle-wireframe').addEventListener('change', (e) => {
            if (currentModel) {
                currentModel.traverse((child) => { if (child.isMesh) child.material.wireframe = e.target.checked; });
            }
        });
        document.getElementById('toggle-rotate').addEventListener('change', (e) => controls.autoRotate = e.target.checked);
        document.getElementById('reset-view-btn').addEventListener('click', () => {
            if (currentModel) {
                const box = new THREE.Box3().setFromObject(currentModel);
                controls.target.copy(box.getCenter(new THREE.Vector3()));
            } else {
                controls.target.set(0, 0, 0);
            }
            controls.update();
        });

        refreshBtn.addEventListener('click', fetchGitHubModels);

        // Loop Render
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Khởi chạy: Tự động quét các file khi vào trang
        fetchGitHubModels();
    </script>
</body>
</html>
