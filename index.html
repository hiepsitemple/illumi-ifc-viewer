<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Mô hình 3D - GitHub Pages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f6f8fa;
            color: #24292f;
        }
        .card {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 1px 3px rgba(31,35,40,0.12);
        }
        h2 { margin-top: 0; }
        .status {
            padding: 10px;
            border-radius: 6px;
            background: #ddf4ff;
            color: #0969da;
            font-weight: bold;
            margin-bottom: 15px;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 12px;
            border-bottom: 1px solid #hsla(210,18%,87%,1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li:last-child { border-bottom: none; }
        .file-name { font-weight: 600; color: #1f2328; }
        .file-link {
            text-decoration: none;
            color: #0969da;
            background: #f3f4f6;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        .file-link:hover { background: #e5e7eb; }
    </style>
</head>
<body>

<div class="card">
    <h2>📁 Thư mục /models</h2>
    <div id="status" class="status">🔄 Đang quét file từ GitHub...</div>
    <ul id="modelList"></ul>
</div>

<script>
    // --- CẤU HÌNH THÔNG TIN GITHUB ---
    // Mặc định tự động nhận diện nếu chạy trên GitHub Pages (username.github.io/repo-name)
    let OWNER = "hiepsitemple"; 
    let REPO = "illumi-ifc-viewer"; 
    const FOLDER_PATH = "models"; // Thư mục cần quét

    // Tự động tách Username và Repo nếu đang chạy trực tiếp trên web GitHub Pages
    if (window.location.hostname.endsWith('github.io')) {
        OWNER = window.location.hostname.split('.')[0];
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        if (pathSegments.length > 0) {
            REPO = pathSegments[0];
        }
    }

    const statusEl = document.getElementById('status');
    const modelListEl = document.getElementById('modelList');
    const validExtensions = ['.stl', '.obj', '.ifc', '.ply', '.3mf', '.gltf', '.glb'];

    // Gọi API của GitHub để lấy danh sách file trong thư mục models/
    async function scanGitHubModels() {
        const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}`;

        try {
            const response = await fetch(apiUrl);

            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error(`Không tìm thấy thư mục "${FOLDER_PATH}" hoặc repository "${OWNER}/${REPO}".`);
                }
                throw new Error(`Lỗi kết nối GitHub API (Mã: ${response.status})`);
            }

            const data = await response.json();

            // Lọc các file có đuôi mở rộng là file mô hình 3D
            const modelFiles = data.filter(item => {
                if (item.type !== 'file') return false;
                const fileName = item.name.toLowerCase();
                return validExtensions.some(ext => fileName.endsWith(ext));
            });

            modelListEl.innerHTML = '';

            if (modelFiles.length === 0) {
                statusEl.textContent = '⚠️ Thư mục models/ không có file 3D nào!';
                statusEl.style.background = '#fff8c5';
                statusEl.style.color = '#9a6700';
                return;
            }

            // Hiển thị từng file ra màn hình
            modelFiles.forEach(file => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="file-name">📦 ${file.name}</span>
                    <a class="file-link" href="${file.download_url}" target="_blank" download>Tải về / Raw</a>
                `;
                modelListEl.appendChild(li);
            });

            statusEl.textContent = `✅ Đã quét thành công ${modelFiles.length} file mô hình!`;
            statusEl.style.background = '#dafbe1';
            statusEl.style.color = '#1a7f37';

        } catch (error) {
            console.error(error);
            statusEl.textContent = `❌ ${error.message}`;
            statusEl.style.background = '#ffebe9';
            statusEl.style.color = '#cf222e';
        }
    }

    // Chạy hàm quét
    scanGitHubModels();
</script>
<!-- Script xử lý Logic 3D và Kết nối Quét File -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { IFCLoader } from 'web-ifc-three';

    // ==========================================
    // 1. Khởi tạo Three.js Scene & Viewer
    // ==========================================
    const container = document.getElementById('viewer-container');
    const canvas = document.getElementById('three-canvas');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a); // Background tối chuẩn Tailwind slate-900

    // Camera
    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(20, 20, 20);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    // Controls
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting (Ánh sáng)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight1.position.set(25, 40, 20);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x90e0ef, 0.4);
    dirLight2.position.set(-20, -20, -20);
    scene.add(dirLight2);

    // Grid Helper (Lưới mặt phẳng)
    const gridHelper = new THREE.GridHelper(50, 50, 0x3b82f6, 0x334155);
    scene.add(gridHelper);

    // Axes Helper (Trục tọa độ)
    const axesHelper = new THREE.AxesHelper(5);
    scene.add(axesHelper);

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Loop Animation
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ==========================================
    // 2. Cấu hình IFC Loader (WebAssembly)
    // ==========================================
    const ifcLoader = new IFCLoader();
    // Đặt đường dẫn tải file web-ifc.wasm từ CDN unpkg
    ifcLoader.ifcManager.setWasmPath('https://unpkg.com/web-ifc@0.0.57/');

    let currentModel = null;
    let isWireframe = false;

    // Loading overlay controls
    const loadingSpinner = document.getElementById('loadingSpinner');
    const loadingText = document.getElementById('loadingText');

    function showLoading(show, text = "Đang tải mô hình...") {
      loadingText.textContent = text;
      loadingSpinner.classList.toggle('hidden', !show);
    }

    // ==========================================
    // 3. Hàm Tải File IFC vào Khung Nhìn 3D
    // ==========================================
    async function loadIFCModel(fileUrl, fileName) {
      showLoading(true, `Đang tải dữ liệu: ${fileName}`);
      document.getElementById('activeFileName').textContent = fileName;

      // Xóa mô hình cũ nếu đang hiển thị
      if (currentModel) {
        scene.remove(currentModel);
        currentModel.geometry?.dispose();
        currentModel = null;
      }

      try {
        // Fetch file dưới dạng Blob để xử lý mượt mà không lo lỗi đường dẫn
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        showLoading(true, "Đang dựng hình 3D hình học...");

        ifcLoader.load(blobUrl, (ifcModel) => {
          currentModel = ifcModel;
          scene.add(ifcModel);

          // Tự động điều khiển Camera ôm trọn Mô hình (Fit to bounds)
          fitCameraToModel(ifcModel);

          showLoading(false);
          URL.revokeObjectURL(blobUrl); // Dọn dẹp bộ nhớ Blob
        }, 
        (progress) => {
          if (progress.total > 0) {
            const percent = Math.round((progress.loaded / progress.total) * 100);
            loadingText.textContent = `Đang dựng mô hình 3D: ${percent}%`;
          }
        }, 
        (error) => {
          console.error("Lỗi parse IFC:", error);
          showLoading(false);
          alert("Lỗi: Không thể dựng mô hình IFC này. Vui lòng kiểm tra lại cấu trúc file.");
        });

      } catch (err) {
        console.error("Lỗi fetch file:", err);
        showLoading(false);
        alert("Lỗi kết nối khi tải file IFC từ GitHub.");
      }
    }

    // Tự động căn góc nhìn camera theo kích thước mô hình
    function fitCameraToModel(model) {
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      let cameraDistance = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.8;

      camera.position.set(center.x + cameraDistance, center.y + cameraDistance, center.z + cameraDistance);
      camera.lookAt(center);
      controls.target.copy(center);
      controls.update();
    }

    // ==========================================
    // 4. Logic Quét File IFC từ GitHub Repo
    // ==========================================
    const scanBtn = document.getElementById('scanBtn');
    const repoInput = document.getElementById('repoInput');
    const fileListEl = document.getElementById('fileList');
    const fileCountEl = document.getElementById('fileCount');

    // Repo mẫu mặc định
    repoInput.value = "bimspot/ifc-pipeline-sample";

    async function scanGitHubRepo() {
      const repoPath = repoInput.value.trim();
      if (!repoPath || !repoPath.includes('/')) {
        alert("Vui lòng nhập định dạng 'owner/repository'");
        return;
      }

      fileListEl.innerHTML = `<div class="text-center text-slate-400 py-6"><i class="fa-solid fa-spinner animate-spin mr-2"></i>Đang tìm file .ifc...</div>`;

      try {
        const apiUrl = `https://api.github.com/repos/${repoPath}/git/trees/main?recursive=1`;
        let res = await fetch(apiUrl);
        
        // Mẹo thử branch 'master' nếu branch 'main' không tồn tại
        if (!res.ok) {
          const resMaster = await fetch(`https://api.github.com/repos/${repoPath}/git/trees/master?recursive=1`);
          if (resMaster.ok) res = resMaster;
        }

        if (!res.ok) throw new Error("Không thể truy cập Repository. Vui lòng kiểm tra tên repo.");

        const data = await res.json();
        // Lọc các file có đuôi .ifc
        const ifcFiles = data.tree.filter(item => item.type === 'blob' && item.path.toLowerCase().endsWith('.ifc'));

        renderFileList(ifcFiles, repoPath);

      } catch (err) {
        fileListEl.innerHTML = `<div class="text-center text-red-400 py-6 text-sm">${err.message}</div>`;
        fileCountEl.textContent = '0';
      }
    }

    function renderFileList(files, repoPath) {
      fileCountEl.textContent = files.length;

      if (files.length === 0) {
        fileListEl.innerHTML = `<div class="text-center text-slate-400 py-6 text-sm">Không tìm thấy file <code>.ifc</code> nào trong repository này.</div>`;
        return;
      }

      fileListEl.innerHTML = '';
      files.forEach((file, index) => {
        const rawUrl = `https://raw.githubusercontent.com/${repoPath}/HEAD/${file.path}`;
        const fileName = file.path.split('/').pop();

        const card = document.createElement('div');
        card.className = "file-item p-3 bg-slate-700/50 hover:bg-blue-600/20 border border-slate-700 hover:border-blue-500/50 rounded-xl cursor-pointer transition flex items-start space-x-3 group";
        
        card.innerHTML = `
          <div class="p-2 bg-slate-800 rounded-lg text-blue-400 group-hover:text-blue-300">
            <i class="fa-solid fa-cube text-lg"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold text-slate-200 truncate group-hover:text-white" title="${fileName}">${fileName}</div>
            <div class="text-xs text-slate-400 truncate mt-0.5">${file.path}</div>
          </div>
        `;

        // Sự kiện CLICK VÀO FILE -> Tải mô hình 3D
        card.addEventListener('click', () => {
          // Highlight file được chọn
          document.querySelectorAll('.file-item').forEach(el => el.classList.remove('border-blue-500', 'bg-blue-600/30'));
          card.classList.add('border-blue-500', 'bg-blue-600/30');

          loadIFCModel(rawUrl, fileName);
        });

        fileListEl.appendChild(card);
      });
    }

    scanBtn.addEventListener('click', scanGitHubRepo);
    repoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') scanGitHubRepo();
    });

    // Quét sẵn ngay khi tải trang lần đầu
    scanGitHubRepo();

    // ==========================================
    // 5. Điều khiển Toolbar Viewer
    // ==========================================
    // Đặt lại camera
    document.getElementById('resetCamBtn').addEventListener('click', () => {
      if (currentModel) fitCameraToModel(currentModel);
    });

    // Bật / Tắt Grid
    document.getElementById('toggleGridBtn').addEventListener('click', () => {
      gridHelper.visible = !gridHelper.visible;
      axesHelper.visible = !axesHelper.visible;
    });

    // Bật / Tắt Wireframe mode
    document.getElementById('wireframeBtn').addEventListener('click', () => {
      if (!currentModel) return;
      isWireframe = !isWireframe;
      currentModel.traverse((child) => {
        if (child.isMesh && child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach(m => m.wireframe = isWireframe);
          } else {
            child.material.wireframe = isWireframe;
          }
        }
      });
    });
  </script>
</body>
</html>
