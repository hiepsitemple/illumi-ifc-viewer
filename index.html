<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Xem Mô Hình 3D IFC (GitHub BIM Viewer)</title>
    <!-- Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 3px; }
    </style>

    <!-- Import Map cho Three.js, OrbitControls & Web-IFC -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/examples/jsm/controls/OrbitControls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
            "web-ifc": "https://unpkg.com/web-ifc@0.0.57/web-ifc-api.js",
            "web-ifc-three": "https://unpkg.com/web-ifc-three@0.0.126/IFCLoader.js"
        }
    }
    </script>
</head>
<body class="text-slate-200 select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layout -->
    <div class="relative z-10 pointer-events-none w-full h-screen flex flex-col justify-between p-4">
        
        <!-- Header Bar -->
        <header class="pointer-events-auto bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-xl p-3 shadow-2xl flex items-center justify-between gap-4 max-w-7xl mx-auto w-full">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600/20 text-blue-400 rounded-lg border border-blue-500/30">
                    <i data-lucide="box" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-100 text-base leading-tight">IFC 3D BIM Viewer</h1>
                    <p class="text-xs text-slate-400">Tự động quét file <code class="bg-slate-800 px-1 py-0.5 rounded text-blue-400">.ifc</code> từ thư mục <code class="bg-slate-800 px-1 py-0.5 rounded text-blue-400">models/</code></p>
                </div>
            </div>

            <!-- Tải file thủ công từ máy tính -->
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-md transition flex items-center gap-2 border border-slate-700">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span>Tải file local (.ifc)</span>
                <input type="file" id="local-file-input" accept=".ifc" class="hidden">
            </label>
        </header>

        <!-- Workspace chính: Sidebar Trái + Khung Viewer + Sidebar Phải -->
        <div class="flex-1 flex justify-between gap-4 my-4 overflow-hidden">
            
            <!-- Sidebar Trái: Danh sách File Quét được & Thông tin BIM -->
            <aside class="pointer-events-auto w-80 bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-xl p-4 shadow-xl flex flex-col gap-4 overflow-y-auto">
                <!-- Danh sách file mô hình -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                            <i data-lucide="folder-tree" class="w-4 h-4 text-blue-400"></i> Mô Hình GitHub
                        </h3>
                        <button id="refresh-btn" title="Quét lại thư mục" class="text-slate-400 hover:text-blue-400 transition p-1">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>

                    <div id="models-list" class="space-y-1.5 text-xs">
                        <div class="p-3 bg-slate-950/40 border border-slate-800/60 rounded-lg text-slate-400 text-center text-xs flex items-center justify-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> Đang quét thư mục models/...
                        </div>
                    </div>
                </div>

                <hr class="border-slate-800">

                <!-- Bảng thuộc tính BIM Data -->
                <div class="flex-1 flex flex-col">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                        <i data-lucide="info" class="w-4 h-4 text-emerald-400"></i> Thuộc Tính Cấu Kiện
                    </h3>
                    <div id="property-panel" class="flex-1 text-xs text-slate-400 bg-slate-950/50 p-3 rounded-lg border border-slate-800/60 overflow-y-auto max-h-[220px]">
                        Click chọn một vật thể 3D để xem thông số chi tiết.
                    </div>
                </div>
            </aside>

            <!-- Khung giữa: Trạng thái Loading Overlay khi tải 3D -->
            <div id="loading-overlay" class="hidden absolute inset-0 z-20 bg-slate-950/70 backdrop-blur-sm flex flex-col items-center justify-center pointer-events-auto">
                <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                <p id="loading-text" class="text-sm font-medium text-slate-200">Đang giải mã mô hình IFC 3D...</p>
            </div>

            <!-- Sidebar Phải: Công cụ điều khiển Viewer -->
            <aside class="pointer-events-auto w-60 bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-xl p-4 shadow-xl flex flex-col gap-4 self-start">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i> Điều Khiển Xem
                </h3>

                <div class="space-y-2.5 text-xs">
                    <label class="flex items-center justify-between p-2 bg-slate-950/40 rounded-lg border border-slate-800/60 cursor-pointer hover:bg-slate-800/40">
                        <span class="flex items-center gap-2"><i data-lucide="grid" class="w-4 h-4 text-slate-400"></i> Lưới Mặt Đất</span>
                        <input type="checkbox" id="toggle-grid" checked class="rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-0">
                    </label>

                    <label class="flex items-center justify-between p-2 bg-slate-950/40 rounded-lg border border-slate-800/60 cursor-pointer hover:bg-slate-800/40">
                        <span class="flex items-center gap-2"><i data-lucide="box" class="w-4 h-4 text-slate-400"></i> Khung Dây (Wireframe)</span>
                        <input type="checkbox" id="toggle-wireframe" class="rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-0">
                    </label>

                    <label class="flex items-center justify-between p-2 bg-slate-950/40 rounded-lg border border-slate-800/60 cursor-pointer hover:bg-slate-800/40">
                        <span class="flex items-center gap-2"><i data-lucide="rotate-cw" class="w-4 h-4 text-slate-400"></i> Tự Động Xoay</span>
                        <input type="checkbox" id="toggle-rotate" class="rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-0">
                    </label>
                </div>

                <hr class="border-slate-800">

                <button id="reset-view-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium py-2 rounded-lg border border-slate-700 transition flex items-center justify-center gap-2">
                    <i data-lucide="focus" class="w-4 h-4"></i> Căn Giữa Camera
                </button>
            </aside>
        </div>

        <!-- Footer / Status Bar -->
        <footer class="pointer-events-auto bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-xl px-4 py-2 text-xs text-slate-400 flex justify-between items-center max-w-7xl mx-auto w-full">
            <span id="status-text" class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                Sẵn sàng. Chọn mô hình bên trái để xem.
            </span>
            <span id="active-file-name" class="font-mono text-[11px] text-blue-400 truncate max-w-xs">
                Chưa chọn mô hình
            </span>
        </footer>
    </div>

    <!-- Script Logic Chính (Three.js + Web-IFC + Quét GitHub) -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';
        import { IFCLoader } from 'web-ifc-three';

        // Khởi tạo Lucide Icons
        lucide.createIcons();

        // =================================================================
        // 1. KHỞI TẠO THREE.JS SCENE, CAMERA, LIGHTING
        // =================================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        // Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 20, 30);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Orbit Controls (Xoay, Phóng to/Thu nhỏ)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 80, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x90caf9, 0.5);
        dirLight2.position.set(-50, -20, -40);
        scene.add(dirLight2);

        // Lưới mặt đất (Grid Helper)
        const gridHelper = new THREE.GridHelper(100, 100, 0x3b82f6, 0x1e293b);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        // Khởi tạo IFC Loader & Cấu hình WebAssembly WASM
        const ifcLoader = new IFCLoader();
        ifcLoader.ifcManager.setWasmPath('https://unpkg.com/web-ifc@0.0.57/');

        // Element DOM references
        const modelsList = document.getElementById('models-list');
        const statusText = document.getElementById('status-text');
        const activeFileName = document.getElementById('active-file-name');
        const propertyPanel = document.getElementById('property-panel');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const localFileInput = document.getElementById('local-file-input');
        const refreshBtn = document.getElementById('refresh-btn');

        let currentModel = null;
        let isWireframe = false;

        // =================================================================
        // 2. PHẦN 1: QUÉT TỰ ĐỘNG THƯ MỤC "models/" TRÊN GITHUB
        // =================================================================
        async function autoDetectIFCFiles() {
            try {
                const hostname = window.location.hostname;
                const pathParts = window.location.pathname.split('/').filter(Boolean);

                // Kiểm tra xem có đang chạy trên GitHub Pages không
                if (!hostname.includes('github.io')) {
                    return { 
                        files: [], 
                        error: "Đang chạy ở môi trường Local/Custom Server. Tính năng tự động quét chỉ kích hoạt trên GitHub Pages. Bạn có thể mở file trực tiếp qua nút 'Tải file local'." 
                    };
                }

                // Tự động bóc tách Username & Repo Name
                const owner = hostname.split('.')[0];
                const repo = pathParts.length > 0 ? pathParts[0] : `${owner}.github.io`;

                // 1. Kiểm tra Branch mặc định của Repo
                const repoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
                if (!repoRes.ok) {
                    if (repoRes.status === 404) {
                        throw new Error(`Không tìm thấy Repository '${owner}/${repo}'. Đảm bảo Repo ở chế độ PUBLIC.`);
                    }
                    throw new Error(`Không thể kết nối GitHub API (HTTP ${repoRes.status})`);
                }
                const repoData = await repoRes.json();
                const defaultBranch = repoData.default_branch || 'main';

                // 2. Gọi API lấy danh sách file trong thư mục models/
                const contentsRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/models?ref=${defaultBranch}`);
                if (!contentsRes.ok) {
                    if (contentsRes.status === 404) {
                        throw new Error(`Thư mục 'models' chưa tồn tại hoặc chưa có file nào trên branch '${defaultBranch}'.`);
                    }
                    throw new Error(`Lỗi đọc thư mục 'models' (HTTP ${contentsRes.status})`);
                }

                const contents = await contentsRes.json();
                if (!Array.isArray(contents)) {
                    throw new Error("Dữ liệu trả về không phải thư mục hợp lệ.");
                }

                // Lọc các file có đuôi .ifc
                const ifcFiles = contents
                    .filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.ifc'))
                    .map(item => item.name);

                return { files: ifcFiles, error: null };

            } catch (err) {
                console.error("Lỗi tự động quét file:", err);
                return { files: [], error: err.message };
            }
        }

        // Vẽ danh sách file ra giao diện
        async function renderModelsList() {
            modelsList.innerHTML = `
                <div class="p-3 bg-slate-950/40 border border-slate-800/60 rounded-lg text-slate-400 text-center text-xs flex items-center justify-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> Đang quét thư mục models/...
                </div>
            `;

            const { files, error } = await autoDetectIFCFiles();

            modelsList.innerHTML = '';

            if (error) {
                modelsList.innerHTML = `
                    <div class="p-3 bg-slate-950/50 border border-slate-800/60 rounded-lg text-slate-400 text-xs">
                        <p class="text-amber-400 font-medium mb-1 flex items-center gap-1">
                            <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> Thông báo:
                        </p>
                        <p class="text-[11px] leading-relaxed text-slate-400">${error}</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            if (files.length === 0) {
                modelsList.innerHTML = `
                    <div class="p-3 bg-slate-950/50 border border-slate-800/60 rounded-lg text-slate-400 text-center text-xs">
                        Thư mục <code class="text-blue-400">models/</code> trống. <br>Vui lòng ném file <code class="text-blue-400">.ifc</code> vào thư mục này.
                    </div>
                `;
                return;
            }

            // Hiển thị từng nút chọn file
            files.forEach(fileName => {
                const fileCard = document.createElement('button');
                fileCard.className = 'w-full text-left p-2.5 bg-slate-950/60 hover:bg-blue-900/30 border border-slate-800/80 hover:border-blue-500/50 rounded-lg transition flex items-center justify-between group';
                
                fileCard.innerHTML = `
                    <div class="flex items-center gap-2 truncate pr-2">
                        <i data-lucide="file-text" class="w-4 h-4 text-blue-400 shrink-0"></i>
                        <span class="truncate font-medium text-slate-200 group-hover:text-blue-300">${fileName}</span>
                    </div>
                    <i data-lucide="play-circle" class="w-4 h-4 text-slate-500 group-hover:text-blue-400 shrink-0"></i>
                `;

                // Sự kiện CLICK VÀO FILE -> Load vào khung 3D
                fileCard.addEventListener('click', () => {
                    const relativePath = `./models/${fileName}`;
                    loadIFCFromURL(relativePath, fileName);
                });

                modelsList.appendChild(fileCard);
            });

            lucide.createIcons();
        }

        refreshBtn.addEventListener('click', renderModelsList);

        // =================================================================
        // 3. PHẦN 2: GIẢI MÃ VÀ HIỂN THỊ MÔ HÌNH 3D IFC
        // =================================================================
        async function loadIFCFromURL(url, fileName) {
            statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Đang tải <b>${fileName}</b>...`;
            activeFileName.textContent = fileName;
            
            loadingText.textContent = `Đang tải & dựng mô hình 3D: ${fileName}...`;
            loadingOverlay.classList.remove('hidden');

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Không tải được file từ đường dẫn: ${url} (HTTP ${response.status})`);
                }

                const buffer = await response.arrayBuffer();

                // Xóa mô hình cũ nếu đang hiển thị
                if (currentModel) {
                    scene.remove(currentModel);
                    currentModel.geometry?.dispose();
                    currentModel = null;
                }

                // Giải mã dữ liệu IFC bằng WebAssembly
                ifcLoader.ifcManager.parse(buffer).then((ifcModel) => {
                    currentModel = ifcModel;
                    scene.add(ifcModel);

                    // Tự động căn camera ôm trọn mô hình
                    fitCameraToModel(ifcModel);

                    // Áp dụng chế độ Wireframe nếu đang bật
                    if (isWireframe) {
                        currentModel.traverse((child) => { if (child.isMesh) child.material.wireframe = true; });
                    }

                    loadingOverlay.classList.add('hidden');
                    statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Đã hiển thị: <b>${fileName}</b>`;
                });

            } catch (err) {
                console.error("Lỗi nạp file IFC:", err);
                loadingOverlay.classList.add('hidden');
                statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> ${err.message}`;
                alert(`Lỗi: ${err.message}`);
            }
        }

        // Tự động điều chỉnh Camera bao quanh mô hình
        function fitCameraToModel(model) {
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);

            controls.target.copy(center);
            camera.position.set(center.x + maxDim * 1.2, center.y + maxDim * 0.8, center.z + maxDim * 1.2);
            controls.update();
        }

        // Tải file thủ công từ máy tính
        localFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            loadIFCFromURL(url, file.name);
        });

        // Click chuột chọn vật thể 3D để trích xuất thuộc tính Express ID
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.tagName !== 'CANVAS' || !currentModel) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(currentModel);

            if (intersects.length > 0) {
                const faceIndex = intersects[0].faceIndex;
                const expressID = ifcLoader.ifcManager.getExpressId(currentModel.geometry, faceIndex);

                if (expressID !== undefined) {
                    propertyPanel.innerHTML = `
                        <div class="space-y-1.5 text-left">
                            <div class="text-blue-400 font-semibold border-b border-slate-800 pb-1">Express ID: #${expressID}</div>
                            <div><span class="text-slate-400">Định dạng:</span> <span class="text-slate-200">IFC Mesh Component</span></div>
                            <div><span class="text-slate-400">Tọa độ chọn:</span> <br><span class="font-mono text-[10px] text-emerald-400">X:${intersects[0].point.x.toFixed(2)}, Y:${intersects[0].point.y.toFixed(2)}, Z:${intersects[0].point.z.toFixed(2)}</span></div>
                        </div>
                    `;
                }
            }
        });

        // =================================================================
        // 4. ĐIỀU KHUYỂN THANH CÔNG CỤ VIEWER
        // =================================================================
        document.getElementById('toggle-grid').addEventListener('change', (e) => {
            gridHelper.visible = e.target.checked;
        });

        document.getElementById('toggle-wireframe').addEventListener('change', (e) => {
            isWireframe = e.target.checked;
            if (currentModel) {
                currentModel.traverse((child) => {
                    if (child.isMesh) child.material.wireframe = isWireframe;
                });
            }
        });

        document.getElementById('toggle-rotate').addEventListener('change', (e) => {
            controls.autoRotate = e.target.checked;
            controls.autoRotateSpeed = 2.0;
        });

        document.getElementById('reset-view-btn').addEventListener('click', () => {
            if (currentModel) {
                fitCameraToModel(currentModel);
            } else {
                controls.target.set(0, 0, 0);
                camera.position.set(30, 20, 30);
                controls.update();
            }
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Khởi chạy tự động quét khi tải trang
        renderModelsList();
    </script>
</body>
</html>
